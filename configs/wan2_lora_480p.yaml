# TeachDiffusion LoRA — 480p (fits on A100 40GB)
model:
  name: "wan2.2"
  pretrained_path: "Wan-AI/Wan2.2-T2V-14B"
  dtype: "bfloat16"
lora:
  rank: 64
  alpha: 64
  dropout: 0.05
  target_modules: ["to_q", "to_k", "to_v", "to_out.0"]
training:
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  max_train_steps: 5000
  save_steps: 500
  mixed_precision: "bf16"
  gradient_checkpointing: true
  seed: 42
data:
  dataset_path: "../teachdiffusion-data/data/filtered"
  manifest_file: "filtered_manifest.json"
  resolution: 480
  num_frames: 16
  fps: 8
output:
  output_dir: "./outputs/480p"
  logging_dir: "./outputs/logs"
